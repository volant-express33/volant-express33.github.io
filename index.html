<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<meta name="description" content="Volants sport en carbone, alcantara et LED pour BMW, Audi, Mercedes, VW, Toyota, Honda et plus. Commandez facilement sur WhatsApp.">

<meta property="og:description" content="Plus de 15 volants sport pour BMW, Audi, Mercedes, VW, Toyota, Honda... Commandez en un clic sur WhatsApp.">

<meta property="og:image" content="https://jessdzuno.github.io/Volant-express/images/og-image.jpg">

<meta name="twitter:title" content="Volant Express – Volants sport carbone, LED et alcantara">

<meta name="theme-color" content="#0b3d91">
<style>
  :root{
    --blue:#0b3d91; --blue-dark:#072a66; --red:#e1222d; --red-dark:#b81821;
    --black:#111114; --white:#ffffff; --bg:#f5f6fa; --muted:#6b7280; --border:#e5e7eb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--black);line-height:1.5}

  .topbar{background:var(--black);color:#fff;text-align:center;font-size:.8rem;padding:7px 12px;letter-spacing:.3px}
  header{background:var(--white);position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .tricolor{height:5px;background:linear-gradient(90deg,var(--blue) 0 33.33%,var(--white) 33.33% 66.66%,var(--red) 66.66% 100%);border-bottom:1px solid var(--border)}
  .bar{max-width:1150px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:2.1rem;line-height:1;letter-spacing:1.5px;text-transform:uppercase;display:inline-block;transform:skewX(-8deg)}
  .logo .w1{color:var(--blue)}
  .logo .w2{color:var(--red)}
  .head-btn{background:var(--blue);color:#fff;text-decoration:none;padding:9px 18px;border-radius:999px;font-weight:600;font-size:.9rem}
  .head-btn:hover{background:var(--blue-dark)}

  .hero{background:linear-gradient(rgba(4,12,34,.72),rgba(4,12,34,.78)),url("images/hero.jpg") center 40%/cover no-repeat,var(--blue-dark);color:#fff;text-align:center;padding:64px 18px 72px;position:relative}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--red)}
  .hero h1{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(2.4rem,8vw,4.2rem);letter-spacing:2px;text-transform:uppercase;line-height:1.05;margin-bottom:12px;text-shadow:0 3px 16px rgba(0,0,0,.7)}
  .hero p{max-width:560px;margin:0 auto 26px;text-shadow:0 2px 10px rgba(0,0,0,.7);font-size:1.05rem}
  .hero a{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:13px 30px;border-radius:999px;font-weight:700}
  .hero a:hover{background:var(--red-dark)}

  .perks{max-width:1150px;margin:-28px auto 0;padding:0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;position:relative;z-index:2}
  .perk{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 6px 20px rgba(0,0,0,.08);display:flex;align-items:center;gap:12px;font-size:.9rem;font-weight:600}
  .perk i{font-style:normal;font-size:1.4rem}

  main{max-width:1150px;margin:auto;padding:44px 18px 20px}
  .section-title{text-align:center;margin-bottom:28px}
  .section-title h2{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(2rem,5vw,2.6rem);letter-spacing:1.5px;text-transform:uppercase;color:var(--black)}
  .section-title h2::after{content:"";display:block;width:60px;height:4px;background:var(--red);margin:10px auto 0;border-radius:2px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
  .filters button{border:1.5px solid var(--border);background:#fff;padding:8px 18px;border-radius:999px;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--black)}
  .filters button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
  .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(11,61,145,.15)}
  .photo{aspect-ratio:1/1;background:linear-gradient(135deg,#e8edf8,#f7e4e6);display:flex;align-items:center;justify-content:center;font-size:4.5rem;position:relative;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .info{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .type{align-self:flex-start;background:var(--black);color:#fff;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
  .info h3{font-size:1.05rem;font-weight:700}
  .info p{color:var(--muted);font-size:.88rem;flex:1}
  .price{font-size:1.25rem;font-weight:800;color:var(--blue)}
  .order{display:block;text-align:center;text-decoration:none;background:var(--red);color:#fff;border-radius:10px;padding:11px;font-weight:700}
  .order:hover{background:var(--red-dark)}

  .more{text-align:center;padding:44px 18px 56px}
  .more p{color:var(--muted);margin-bottom:16px}
  .more a{display:inline-block;background:var(--black);color:#fff;text-decoration:none;padding:15px 44px;border-radius:999px;font-weight:700;font-size:1.05rem;border:3px solid var(--black)}
  .more a:hover{background:#fff;color:var(--black)}

  footer{background:var(--black);color:#cbd5e1;text-align:center;padding:34px 18px;font-size:.88rem}
  footer strong{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:1.5px;text-transform:uppercase;color:#fff;display:block;font-size:1.6rem;margin-bottom:6px}
  footer .tricolor{width:90px;height:4px;margin:14px auto 0;border:0;border-radius:2px}

  .fab{position:fixed;right:18px;bottom:18px;z-index:20;background:#25d366;color:#fff;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);text-decoration:none}
  .fab svg{width:32px;height:32px;fill:#fff}

  /* ---- Engagements ---- */
  .trust{max-width:1150px;margin:34px auto 0;padding:0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .trust-card{background:#fff;border-radius:16px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--border);border-left:5px solid var(--blue)}
  .trust-card:nth-child(2){border-left-color:var(--red)}
  .trust-card i{font-style:normal;font-size:1.8rem;line-height:1}
  .trust-card strong{display:block;font-size:1rem;margin-bottom:2px}
  .trust-card span{color:var(--muted);font-size:.88rem}

  /* ---- Cartes : 2 boutons ---- */
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .add{background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:10px;padding:10px;font-weight:700;font-family:inherit;font-size:.95rem;cursor:pointer}
  .add:hover{background:var(--blue);color:#fff}
  .mini-trust{font-size:.76rem;color:var(--muted)}

  /* ---- Panier ---- */
  .cart-btn{white-space:nowrap;flex:none;position:relative;background:var(--black);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:8px}
  .cart-btn:hover{background:#2a2a30}
  .cart-count{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
  .bar-right{display:flex;gap:8px;align-items:center}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  #overlay.show{opacity:1;pointer-events:auto}
  #cart{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:#fff;z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
  #cart.open{transform:none}
  .cart-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .cart-head h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:1.7rem;letter-spacing:1px}
  .cart-close{background:none;border:0;font-size:1.8rem;line-height:1;cursor:pointer;color:var(--black)}
  #cartItems{flex:1;overflow:auto;padding:6px 18px}
  .line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
  .line img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#eee;flex:none}
  .line-info{flex:1;min-width:0}
  .line-info b{display:block;font-size:.9rem;line-height:1.25}
  .line-info small{color:var(--muted)}
  .qty{display:flex;align-items:center;gap:8px;margin-top:6px}
  .qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:#fff;font-size:1rem;cursor:pointer;font-family:inherit}
  .qty button:hover{border-color:var(--blue);color:var(--blue)}
  .line-total{font-weight:700;color:var(--blue);white-space:nowrap;font-size:.95rem}
  .remove{background:none;border:0;color:var(--red);cursor:pointer;font-size:.78rem;padding:0;margin-top:4px;font-family:inherit}
  .empty{text-align:center;color:var(--muted);padding:48px 12px}
  .cart-foot{padding:16px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;background:#fafbfd}
  .cart-foot input{padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;font-family:inherit}
  .cart-foot input:focus{outline:none;border-color:var(--blue)}
  .total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem}
  .cart-note{font-size:.78rem;color:var(--muted);text-align:center}
  .send{background:#25d366;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  .send:hover{background:#1ebe5a}
  .send:disabled{background:#b6c2bc;cursor:not-allowed}
  .toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--black);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- Ajustements téléphone ---- */
  html,body{overflow-x:hidden}
  #cart{height:100vh;height:100dvh;max-width:100vw}
  .toast{bottom:auto;top:84px;transform:translate(-50%,-12px)}
  .toast.show{transform:translate(-50%,0)}
  @media (max-width:560px){
    .bar{padding:12px 14px;gap:8px}
    .logo{font-size:1.55rem;letter-spacing:1px}
    .head-btn{display:none}
    .cart-btn{padding:9px 14px}
    .topbar{font-size:.72rem}
    .hero{padding:48px 16px 60px}
  }
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>
<header>
  <div class="tricolor"></div>
  <div class="bar">
    <div class="logo" id="logo"></div>
    <div class="bar-right">
      <a class="head-btn" id="headWa" target="_blank" rel="noopener">WhatsApp</a>
      <button class="cart-btn" id="cartBtn" aria-label="Ouvrir le panier">🛒 Panier <span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 id="heroTitle"></h1>
  <p id="heroText"></p>
  <a href="#articles">Découvrir les volants</a>
</section>

<div class="perks">
  <div class="perk"><i>💬</i> Commande simple</div>
  <div class="perk"><i>⚡</i> Réponse rapide</div>
</div>

<section class="trust" id="trust"></section>

<main id="articles">
  <div class="section-title"><h2>Nos volants</h2></div>
  <div class="grid" id="grid"></div>
</main>

<section class="more">
  <p>Vous n'avez pas trouvé votre bonheur ? Il y a encore plus de volants !</p>
  <a id="moreBtn" target="_blank" rel="noopener">Voir plus</a>
</section>

<footer>
  <strong id="footName"></strong>
  <div id="footText"></div>
  <div class="tricolor"></div>
</footer>

<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 3C9.4 3 4 8.4 4 15c0 2.3.7 4.5 1.9 6.4L4 29l7.8-1.8c1.8 1 3.9 1.5 6.2 1.5 6.600 0 12-5.400 12-12S22.600 3 16 3zm0 21.800c-2 0-3.900-.6-5.500-1.600l-.4-.2-4.600 1.100 1.200-4.500-.3-.4A9.700 9.700 0 0 1 6.200 15c0-5.400 4.400-9.800 9.800-9.800s9.800 4.400 9.800 9.800-4.400 9.800-9.800 9.800zm5.400-7.300c-.3-.1-1.800-.9-2-1-.3-.1-.5-.1-.7.100-.2.300-.8 1-.9 1.200-.2.200-.3.200-.6.100-.3-.1-1.200-.4-2.300-1.400-.9-.8-1.400-1.700-1.600-2-.2-.3 0-.5.100-.6l.4-.5c.1-.2.200-.3.300-.5.100-.2 0-.4 0-.5l-.9-2.200c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1 1-1 2.400s1 2.800 1.200 3c.1.200 2 3.100 4.900 4.300.7.300 1.200.5 1.600.6.700.2 1.300.2 1.800.1.600-.1 1.800-.7 2-1.400.3-.7.300-1.300.2-1.400-.1-.1-.3-.2-.6-.3z"/></svg>
</a>

<div id="overlay"></div>
<aside id="cart" aria-label="Panier" aria-hidden="true">
  <div class="cart-head"><h3>Mon panier</h3><button class="cart-close" id="cartClose" aria-label="Fermer">×</button></div>
  <div id="cartItems"></div>
  <div class="cart-foot">
    <div class="total"><span>Total</span><span id="cartTotal">0 €</span></div>
    <input id="cName" placeholder="Votre nom (facultatif)" autocomplete="name">
    <input id="cCity" placeholder="Ville / pays de livraison (facultatif)" autocomplete="address-level2">
    <button class="send" id="sendBtn">Envoyer ma commande sur WhatsApp</button>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* =================== À PERSONNALISER =================== */
const CONFIG = {
  shopName: "Volant Express",
  heroTitle: "Des volants de voiture de qualité",
  heroText: "Parcourez notre sélection de volants, choisissez le vôtre et commandez en un clic.",
  topbar: "Commandez directement sur WhatsApp – réponse rapide",
  whatsapp: "33673759435",     // +33 6 73 75 94 35
  currency: "EUR",
  deliveryTitle: "Livraison",
  deliveryText: "Expédition rapide et livraison aux frais du client.",
  warrantyTitle: "Garantie",
  warrantyText: "Garantie 6 mois contre les défauts de fabrication.",
  footer: "© 2026 Volant Express – Pour toute commande, contactez-nous sur WhatsApp."
};

/* Pour chaque volant : name, desc, price (en euros), image.
   Mets tes photos dans un dossier "images" (ex: images/volant1.jpg).
   Si l'image est vide ou introuvable, un visuel provisoire s'affiche. */
const PRODUCTS = [
  {name:"Volant carbone Mercedes AMG", desc:"Volant sport en fibre de carbone et cuir perforé, style AMG pour Mercedes. Repère rouge à 12 h.", price:375.90, image:"images/volant1.jpg", emoji:""},
  {name:"Volant carbone forgé Honda", desc:"Volant en fibre de carbone forgé pour Honda.", price:410.49, image:"images/volant2.jpg", emoji:""},
  {name:"Volant cuir sport Golf R", desc:"Volant sport en cuir perforé avec coutures bleues. Compatible VW Golf R 8 MK8, Passat CC, Tiguan, Scirocco.", price:389.99, image:"images/volant3.jpg", emoji:""},
  {name:"Volant LED fibre de carbone GTI", desc:"Compatible VW Golf GTI 5, 6, 7 (MK5, MK6, MK7), Passat, Tiguan, Scirocco.", price:380.50, image:"images/volant4.jpg", emoji:""},
  {name:"Volant carbone forgé GR Toyota", desc:"Compatible Toyota GR Hilux N70, Tundra, Fortuner, LC200, LC300, LC79, Prado.", price:405.75, image:"images/volant5.jpg", emoji:""},
  {name:"Volant GR Toyota", desc:"Compatible Toyota GR Hilux N70, Tundra, Fortuner, LC200, LC300, LC79, Prado.", price:449.90, image:"images/volant6.jpg", emoji:""},
  {name:"Volant carbone forgé style LED", desc:"Compatible VW Golf R 5, 6, 7, 8 (MK5, MK6, MK7), Passat, Tiguan, Scirocco.", price:395.40, image:"images/volant7.jpg", emoji:""},
  {name:"Volant carbone Golf R", desc:"Compatible VW Golf R 5, 6, 7 (MK5, MK6, MK7) et GTI.", price:354.99, image:"images/volant8.jpg", emoji:""},
  {name:"Volant sport BMW cuir et carbone", desc:"Volant sport en cuir et Alcantara avec finitions carbone sur les commandes et la branche basse. Compatible plusieurs modèles BMW.", price:382.90, image:"images/volant9.jpg", emoji:""},
  {name:"Volant LED carbone BMW M", desc:"Volant en fibre de carbone et Alcantara avec bandeau LED, palettes et finitions argentées, style BMW M. Compatible plusieurs modèles BMW.", price:539.99, image:"images/volant10.jpg", emoji:""},
  {name:"Volant carbone Audi RS3", desc:"Volant en fibre de carbone et Alcantara avec repère argent et palettes de changement de vitesse, style Audi RS3.", price:457.80, image:"images/volant11.jpg", emoji:""},
  {name:"Volant carbone forgé Audi RS", desc:"Volant en carbone forgé à éclats rouges, cuir perforé et airbag Alcantara à coutures rouges, avec palettes. Compatible plusieurs modèles Audi.", price:624.99, image:"images/volant12.jpg", emoji:""},
  {name:"Volant carbone Mercedes AMG turquoise", desc:"Volant en fibre de carbone et Alcantara avec repère et coutures turquoise, palettes de changement de vitesse, style AMG.", price:499.99, image:"images/volant13.jpg", emoji:""},
  {name:"Volant LED carbone Mercedes AMG", desc:"Volant en fibre de carbone et Alcantara avec bandeau LED et coutures rouges, style AMG.", price:569.99, image:"images/volant14.jpg", emoji:""},
  {name:"Volant carbone Ford Focus ST", desc:"Volant en fibre de carbone mat et Alcantara à coutures grises, avec finitions carbone sur les commandes. Compatible Ford Focus ST / RS (MK3).", price:399.99, image:"images/volant15.jpg", emoji:""},
  {name:"Volant LED carbone Toyota GR", desc:"Volant en fibre de carbone et cuir perforé avec bandeau LED et coutures rouges, badge GR. Compatible plusieurs modèles Toyota.", price:549.99, image:"images/volant16.jpg", emoji:""},
  {name:"Volant carbone Honda Civic", desc:"Volant sport en fibre de carbone et cuir perforé avec repère rouge et finitions carbone sur les commandes. Compatible Honda Civic.", price:418.75, image:"images/volant17.jpg", emoji:""},
  {name:"Volant carbone Porsche", desc:"Volant en carbone mat et Alcantara gris avec repère jaune à 12 h, coutures jaunes, palettes argentées et finitions carbone sur les commandes. Compatible plusieurs modèles Porsche.", price:679.99, image:"images/volant18.jpg", emoji:""},
  {name:"Volant carbone forgé Mercedes AMG", desc:"Volant en carbone forgé et cuir perforé avec repère rouge à 12 h, coutures rouges et palettes argentées, style AMG. Compatible plusieurs modèles Mercedes.", price:589.90, image:"images/volant19.jpg", emoji:""},
  {name:"Volant carbone Nissan GT-R", desc:"Volant en fibre de carbone mat et Alcantara à coutures rouges, avec finitions carbone sur les commandes. Compatible Nissan GT-R R35.", price:649.50, image:"images/volant20.jpg", emoji:""},
  {name:"Volant carbone Tesla", desc:"Volant en fibre de carbone brillant et cuir avec repère rouge à 12 h, coutures rouges et airbag en Alcantara. Compatible Tesla Model 3 et Model Y.", price:459.99, image:"images/volant21.jpg", emoji:""},
  {name:"Volant cuir sport Subaru WRX", desc:"Volant sport en cuir perforé avec haut mat, repère rouge à 12 h et coutures rouges. Compatible Subaru WRX et WRX STI.", price:429.75, image:"images/volant22.jpg", emoji:""},
  {name:"Volant LED carbone forgé rouge Golf GTI", desc:"Volant en carbone forgé à éclats rouges et cuir perforé avec bandeau LED, palettes assorties et repère rouge. Compatible VW Golf GTI et Golf R.", price:749.99, image:"images/volant23.jpg", emoji:""}
];
/* ======================================================= */

const fmt = n => n.toLocaleString("fr-FR", {style:"currency", currency:CONFIG.currency, minimumFractionDigits:Number.isInteger(n)?0:2, maximumFractionDigits:2});
const wa = text => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(text)}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let current = "Tout";

function init(){
  document.title = CONFIG.shopName + " – Volants de voiture";
  document.getElementById("topbar").textContent = CONFIG.topbar;
  const parts = CONFIG.shopName.split(" "); const first = parts.shift();
  document.getElementById("logo").innerHTML = `<span class="w1">${esc(first)}</span> <span class="w2">${esc(parts.join(" "))}</span>`;
  document.getElementById("heroTitle").textContent = CONFIG.heroTitle;
  document.getElementById("heroText").textContent = CONFIG.heroText;
  document.getElementById("footName").textContent = CONFIG.shopName;
  document.getElementById("footText").textContent = CONFIG.footer;
  const hello = wa("Bonjour, j'ai vu votre boutique en ligne et j'ai une question.");
  document.getElementById("headWa").href = hello;
  document.getElementById("fab").href = hello;
  document.getElementById("moreBtn").href = wa("Bonjour, j'ai vu votre boutique en ligne et je voudrais voir plus de volants.");
  renderGrid();
}

function renderGrid(){
  const list = PRODUCTS.map((p,i)=>({p,i})).filter(({p}) => current === "Tout" || p.type === current);
  document.getElementById("grid").innerHTML = list.map(({p,i}) => `
    <article class="card">
      <div class="photo">
        ${p.emoji ? `<span>${p.emoji}</span>` : ""}
        ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove()">` : ""}
      </div>
      <div class="info">
        ${p.type ? `<span class="type">${esc(p.type)}</span>` : ""}
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.desc)}</p>
        <div class="price">${fmt(p.price)}</div>
        <div class="actions">
          <a class="order" target="_blank" rel="noopener"
             href="${wa(`Bonjour, je veux commander : ${p.name} à ${fmt(p.price)}.`)}">Commander</a>
          <button class="add" data-add="${i}">+ Ajouter au panier</button>
        </div>
      </div>
    </article>`).join("");
}

/* ---------- Engagements ---------- */
function renderTrust(){
  document.getElementById("trust").innerHTML = `
    <div class="trust-card"><i>🚚</i><div><strong>${esc(CONFIG.deliveryTitle)}</strong><span>${esc(CONFIG.deliveryText)}</span></div></div>
    <div class="trust-card"><i>🛡️</i><div><strong>${esc(CONFIG.warrantyTitle)}</strong><span>${esc(CONFIG.warrantyText)}</span></div></div>`;
}

/* ---------- Panier ---------- */
let cart = {};
try { cart = JSON.parse(localStorage.getItem("ve_cart") || "{}") || {}; } catch(e){ cart = {}; }
Object.keys(cart).forEach(k => { if(!PRODUCTS[k] || !(cart[k] > 0)) delete cart[k]; });
const saveCart = () => { try{ localStorage.setItem("ve_cart", JSON.stringify(cart)); }catch(e){} };

function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("show"), 1600);
}
function openCart(open){
  document.getElementById("cart").classList.toggle("open", open);
  document.getElementById("cart").setAttribute("aria-hidden", String(!open));
  document.getElementById("overlay").classList.toggle("show", open);
}
function addToCart(i){ cart[i] = (cart[i]||0)+1; saveCart(); renderCart(); toast("✓ Ajouté au panier"); }
function changeQty(i,d){ cart[i] = (cart[i]||0)+d; if(cart[i] <= 0) delete cart[i]; saveCart(); renderCart(); }
function removeItem(i){ delete cart[i]; saveCart(); renderCart(); }

function cartTotals(){
  let total = 0, count = 0;
  Object.keys(cart).forEach(i => { total += PRODUCTS[i].price * cart[i]; count += cart[i]; });
  return {total: Math.round(total*100)/100, count};
}
function renderCart(){
  const ids = Object.keys(cart);
  document.getElementById("cartItems").innerHTML = ids.length ? ids.map(i => {
    const p = PRODUCTS[i];
    return `<div class="line">
      <img src="${esc(p.image||"")}" alt="" onerror="this.style.visibility='hidden'">
      <div class="line-info"><b>${esc(p.name)}</b><small>${fmt(p.price)} l'unité</small>
        <div class="qty"><button data-q="${i}" data-d="-1" aria-label="Moins">−</button><span>${cart[i]}</span><button data-q="${i}" data-d="1" aria-label="Plus">+</button></div>
        <button class="remove" data-rm="${i}">Retirer</button></div>
      <div class="line-total">${fmt(Math.round(p.price*cart[i]*100)/100)}</div>
    </div>`;
  }).join("") : '<div class="empty">🛒<br>Votre panier est vide.<br>Ajoutez des volants pour commander en un seul message.</div>';
  const {total,count} = cartTotals();
  document.getElementById("cartTotal").textContent = fmt(total);
  document.getElementById("cartCount").textContent = count;
  document.getElementById("sendBtn").disabled = !count;
}
function sendOrder(){
  const ids = Object.keys(cart); if(!ids.length) return;
  const name = document.getElementById("cName").value.trim();
  const city = document.getElementById("cCity").value.trim();
  const {total,count} = cartTotals();
  const lines = ids.map(i => `• ${cart[i]} x ${PRODUCTS[i].name} – ${fmt(Math.round(PRODUCTS[i].price*cart[i]*100)/100)}`);
  let msg = `Bonjour, je souhaite commander (${count} article${count>1?"s":""}) :\n\n${lines.join("\n")}\n\nTotal : ${fmt(total)}`;
  if(name) msg += `\nNom : ${name}`;
  if(city) msg += `\nLivraison : ${city}`;
  msg += `\n\nMerci de me confirmer la disponibilité et les modalités de paiement.`;
  window.open(wa(msg), "_blank");
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-add],[data-q],[data-rm]"); if(!t) return;
  if(t.dataset.add !== undefined) addToCart(+t.dataset.add);
  else if(t.dataset.q !== undefined) changeQty(+t.dataset.q, +t.dataset.d);
  else if(t.dataset.rm !== undefined) removeItem(+t.dataset.rm);
});
document.getElementById("cartBtn").onclick = () => openCart(true);
document.getElementById("cartClose").onclick = () => openCart(false);
document.getElementById("overlay").onclick = () => openCart(false);
document.getElementById("sendBtn").onclick = sendOrder;
document.addEventListener("keydown", e => { if(e.key === "Escape") openCart(false); });

renderTrust(); renderCart();
init();
</script>
</body>
</html>
